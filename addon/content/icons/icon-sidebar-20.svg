<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 128 128">
<defs>
    <!-- Rich Golden Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8C4"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="90%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFFBEB"/>
      <stop offset="70%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Deep Royal Purple Enamel Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="35%" stop-color="#7E22CE"/>
      <stop offset="75%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="50%" stop-color="#1E0B40"/>
      <stop offset="100%" stop-color="#0F0520"/>
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Large Full-Bleed Badge Shape (fills canvas so it looks big and bold in browser toolbar) -->
  <!-- Golden Pole on left edge -->
  <path d="M 5,6 L 13,6 L 13,122 L 5,122 Z" fill="url(#goldGrad)" stroke="#451A03" stroke-width="1.2"/>
  <!-- Finial tip on top of pole -->
  <polygon points="9,1 16,9 2,9" fill="url(#goldLight)" stroke="#451A03" stroke-width="1"/>
  <!-- Bottom pole base -->
  <rect x="3" y="120" width="12" height="5" rx="1.5" fill="url(#goldGrad)" stroke="#451A03" stroke-width="1"/>

  <!-- Main Flag Body Outer Gold Border (fills canvas from x=13 to x=126, y=5 to y=121) -->
  <path d="M 13,10 C 45,2 82,20 120,6 C 125,5 127,9 126,14 L 116,104 C 115,109 110,113 104,113 C 72,113 46,98 13,109 Z" 
        fill="url(#goldGrad)" filter="url(#badgeShadow)" stroke="#451A03" stroke-width="1.8"/>

  <!-- Inner Purple Enamel Field -->
  <path d="M 17,14 C 47,6 81,23 118,11 L 109,101 C 77,101 48,87 17,98 Z" 
        fill="url(#purpleGrad)" stroke="#2E1065" stroke-width="1"/>

  <!-- Golden Soviet / Academic Star (Top Left) -->
  <polygon points="34,21 38,31 49,31 41,37 44,47 34,41 24,47 27,37 19,31 30,31" 
           fill="url(#goldLight)" stroke="#451A03" stroke-width="0.9"/>

  <!-- Academic Open Book & Knowledge Pages (Center) -->
  <!-- Left Page -->
  <path d="M 72,30 C 60,28 47,32 42,34 L 42,58 C 47,56 60,52 72,54 Z" 
        fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1.2"/>
  <!-- Right Page -->
  <path d="M 72,30 C 84,28 97,32 102,34 L 102,58 C 97,56 84,52 72,54 Z" 
        fill="#FFFFFF" stroke="#1E1B4B" stroke-width="1.2"/>
  <!-- Gold Center Spine -->
  <line x1="72" y1="28" x2="72" y2="56" stroke="url(#goldLight)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Book Page Text Lines (Crisp) -->
  <line x1="47" y1="38" x2="67" y2="36" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="47" y1="44" x2="67" y2="42" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="47" y1="50" x2="67" y2="48" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="77" y1="36" x2="97" y2="38" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="77" y1="42" x2="97" y2="44" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="77" y1="48" x2="97" y2="50" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Golden Academic Feather / Quill -->
  <path d="M 100,26 Q 89,38 76,56 L 78,57 Q 92,40 102,28 Z" fill="url(#goldLight)" stroke="#451A03" stroke-width="0.8"/>

  <!-- Prominent Lower Ribbon Banner for ДИНХ (Wide, tall and fills across the flag) -->
  <path d="M 8,64 L 121,64 L 114,104 L 8,104 Z" 
        fill="url(#goldGrad)" stroke="#451A03" stroke-width="2" filter="url(#badgeShadow)"/>
  <path d="M 10,67 L 118,67 L 112,101 L 10,101 Z" 
        fill="url(#bannerBg)" stroke="#3B0764" stroke-width="0.8"/>

  <!-- Large Bold Crisp Lettering: ДИНХ in Gleaming Gold -->
  <text x="64" y="93" 
        font-family="'Arial Black', 'Impact', 'Segoe UI Black', sans-serif" 
        font-weight="900" 
        font-size="25" 
        letter-spacing="2.8" 
        fill="url(#goldLight)" 
        stroke="#451A03" 
        stroke-width="0.8" 
        text-anchor="middle">ДИНХ</text>
</svg>