<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#6B4E03"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63939"/>
      <stop offset="50%" stop-color="#B81414"/>
      <stop offset="100%" stop-color="#800A0A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Golden Flagpole -->
  <path d="M 18,12 L 23,12 L 23,120 L 18,120 Z" fill="url(#goldGrad)" stroke="#4A3602" stroke-width="1"/>
  <!-- Pole Spearhead / Finial -->
  <path d="M 20.5,4 L 26,13 L 15,13 Z" fill="url(#goldGrad)" stroke="#4A3602" stroke-width="1"/>

  <!-- Badge Body: Soviet Waving Flag Outer Gold Border -->
  <path d="M 23,16 C 45,10 75,26 112,14 C 117,13 120,16 119,21 L 109,88 C 108,93 103,96 98,96 C 75,96 50,84 23,94 Z" 
        fill="url(#goldGrad)" filter="url(#shadow)" stroke="#4A3602" stroke-width="1.5"/>

  <!-- Inner Red Enamel Flag Field -->
  <path d="M 25,19 C 45,14 74,28 108,18 L 100,85 C 77,85 52,74 25,84 Z" 
        fill="url(#redGrad)" stroke="#5A0505" stroke-width="1"/>

  <!-- Soviet Star (Top Left) -->
  <polygon points="40,24 43,32 51,32 45,37 47,45 40,40 33,45 35,37 29,32 37,32" 
           fill="url(#goldGrad)" stroke="#4A3602" stroke-width="0.8"/>

  <!-- Academic Open Book (Center) -->
  <!-- Left Page -->
  <path d="M 68,36 C 60,34 50,37 46,39 L 46,55 C 50,53 60,50 68,52 Z" 
        fill="#F4F1EA" stroke="#1A1A1A" stroke-width="1"/>
  <!-- Right Page -->
  <path d="M 68,36 C 76,34 86,37 90,39 L 90,55 C 86,53 76,50 68,52 Z" 
        fill="#F4F1EA" stroke="#1A1A1A" stroke-width="1"/>
  <!-- Book spine / gold trim -->
  <line x1="68" y1="35" x2="68" y2="53" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Page Lines -->
  <line x1="50" y1="42" x2="64" y2="40" stroke="#7D8387" stroke-width="0.8"/>
  <line x1="50" y1="46" x2="64" y2="44" stroke="#7D8387" stroke-width="0.8"/>
  <line x1="50" y1="50" x2="64" y2="48" stroke="#7D8387" stroke-width="0.8"/>
  <line x1="72" y1="40" x2="86" y2="42" stroke="#7D8387" stroke-width="0.8"/>
  <line x1="72" y1="44" x2="86" y2="46" stroke="#7D8387" stroke-width="0.8"/>
  <line x1="72" y1="48" x2="86" y2="50" stroke="#7D8387" stroke-width="0.8"/>

  <!-- Golden Quill / Pen across right page -->
  <path d="M 88,33 Q 80,42 70,54 L 72,55 Q 82,43 90,34 Z" fill="url(#goldGrad)" stroke="#4A3602" stroke-width="0.6"/>

  <!-- Lower Gold Ribbon Banner for Inscription -->
  <path d="M 20,62 L 106,62 L 102,84 L 16,84 Z" 
        fill="url(#goldGrad)" stroke="#4A3602" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M 22,64 L 104,64 L 100,82 L 18,82 Z" 
        fill="#1A1A1A"/>

  <!-- Raised Gold Lettering: ДИНХ -->
  <text x="59" y="79" 
        font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" 
        font-weight="900" 
        font-size="17" 
        letter-spacing="2.5" 
        fill="url(#goldGrad)" 
        stroke="#4A3602" 
        stroke-width="0.5" 
        text-anchor="middle">ДИНХ</text>
</svg>
